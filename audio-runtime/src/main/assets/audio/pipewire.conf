context.properties = {
    core.daemon = true
    core.name = pipewire-0
    support.dbus = false
    mem.allow-mlock = false
    default.clock.rate = 48000
    default.clock.quantum = 256
    default.clock.min-quantum = 256
    default.clock.max-quantum = 256
    default.clock.quantum-limit = 8192
    clock.power-of-two-quantum = false
}
context.spa-libs = {
    audio.convert.* = libspa-audioconvert
    audio.adapt = libspa-audioconvert
    support.* = libspa-support
}
context.modules = [
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-metadata }
]
stream.properties = {
    adapter.auto-port-config = { mode = dsp monitor = false control = false position = preserve }
}
context.objects = [
    { factory = metadata args = {
        metadata.name = default
        metadata.values = [
            { key = default.audio.sink value = { name = magicdesk.android } }
            { key = default.configured.audio.sink value = { name = magicdesk.android } }
        ]
    } }
]
pulse.rules = [
    { matches = [ { application.name = "~.*" } { application.name = null } ]
      actions = { quirks = [ block-record-stream block-sink-volume block-source-volume ] } }
]
