plugins { id 'com.android.application' }

// AGP's built-in Kotlin support adds stdlib even to Java-only applications.
configurations.matching { it.name in ['releaseRuntimeClasspath', 'releaseCompileClasspath',
                                      'debugRuntimeClasspath', 'debugCompileClasspath'] }.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib'
}

android {
    namespace = 'io.github.mekhontsev.magicdesk.launcher'
    compileSdk = 37
    defaultConfig {
        applicationId = 'io.github.mekhontsev.magicdesk.launchertemplate'
        minSdk = 34
        targetSdk = 37
        versionCode = 1
        versionName = '1'
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

// The unsigned, build-time template is an asset, never a separately distributed product.
def icon = tasks.register('prepareTemplateIcon', Sync) {
    from rootProject.file('app/src/main/res/mipmap-xxxhdpi/ic_launcher.png')
    into layout.buildDirectory.dir('generated/templateIcon/drawable-nodpi')
    rename { 'launcher_icon.png' }
}
android.sourceSets.main.res.srcDir layout.buildDirectory.dir('generated/templateIcon').get().asFile
tasks.named('preBuild').configure { dependsOn icon }
