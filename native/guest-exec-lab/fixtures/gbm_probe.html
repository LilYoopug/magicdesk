<!doctype html>
<meta charset="utf-8">
<title>GBM presentation probe</title>
<style>
body { font: 20px sans-serif; margin: 32px; background: #fafafa; color: #222; }
canvas { display: block; margin-top: 20px; width: 480px; height: 240px; }
#moving { width: 60px; height: 24px; background: #137a9e; margin: 24px 0; }
pre { white-space: pre-wrap; font: 16px monospace; }
</style>
<h1>GBM presentation probe</h1>
<button id="start">Start 600 frames</button>
<canvas id="gpu" width="480" height="240"></canvas>
<div id="moving"></div>
<pre id="result"></pre>
<script>
const canvas = document.querySelector('#gpu');
const gl = canvas.getContext('webgl2');
const out = document.querySelector('#result');
const button = document.querySelector('#start');
let frames = 0, errors = 0, running = false;
if (!gl) { out.textContent = 'FAIL: WebGL2 unavailable'; button.disabled = true; }
else {
  const ext = gl.getExtension('WEBGL_debug_renderer_info');
  const renderer = ext ? gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER);
  const pixel = new Uint8Array(4);
  function frame() {
    const green = Math.floor(frames / 60) % 2;
    gl.disable(gl.SCISSOR_TEST);
    gl.clearColor(1-green, green, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT);
    gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, pixel);
    if (pixel[0] !== 255*(1-green) || pixel[1] !== 255*green || pixel[2] !== 0 || pixel[3] !== 255) ++errors;
    gl.enable(gl.SCISSOR_TEST); gl.scissor(frames % 400, 60, 80, 120);
    gl.clearColor(0, 0, 1, 1); gl.clear(gl.COLOR_BUFFER_BIT); gl.flush();
    document.querySelector('#moving').style.transform = `translateX(${frames % 400}px)`;
    ++frames;
    out.textContent = renderer + '\nframes=' + frames + ' pixelErrors=' + errors;
    if (frames < 600) requestAnimationFrame(frame);
    else { running = false; button.disabled = false; out.textContent += errors ? '\nFAIL' : '\nPASS'; }
  }
  button.onclick = () => { if (!running) { running = true; frames = errors = 0; button.disabled = true; requestAnimationFrame(frame); } };
  button.click();
}
</script>
