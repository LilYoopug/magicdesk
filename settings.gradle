pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = 'MagicDesk'
include ':app'
include ':hidden-api-stubs'
include ':kernel-fixes'
include ':terminal-emulator'
include ':x11-runtime'
include ':hosted-runtime'
include ':wayland-runtime'
include ':audio-runtime'
include ':launcher-template'
if (providers.gradleProperty('commandClientFixture').isPresent()) {
    include ':run-command-client'
    project(':run-command-client').projectDir = file('tests/run-command-client')
}
